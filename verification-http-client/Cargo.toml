[package]
name = "conjure-verification-http-client"
edition = "2021"
version = "0.1.0"
authors = ["Steven Fackler <sfackler@palantir.com>"]
license-file = "../LICENSE"

[dependencies]

base64 = "0.22"
bytes = "1"
arc-swap = "1"
flate2 = "1.0"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-openssl = { version = "0.10", features = ["client-legacy"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio", "http1", "http2"] }
lazy_static = "1.0"
log = "0.4"
mime = "0.3"
openssl = "0.10"
parking_lot = "0.12"
pin-project-lite = "0.2"
rand = "0.9"
regex = "1.0"
serde = "1.0"
serde_cbor = "0.11"
serde_json = "1.0"
serde_urlencoded = "0.7"
socket2 = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util"] }
tower-service = "0.3"
url = "2"
conjure-verification-error = { path = "../verification-error" }
conjure-verification-http = { path = "../verification-http" }
conjure-verification-http-client-config = { path = "../verification-http-client-config" }

[dev-dependencies]
tokio-openssl = "0.6"
