buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        classpath 'com.palantir.gradle.externalpublish:gradle-external-publish-plugin:2.4.0'
        classpath 'com.palantir.gradle.failure-reports:gradle-failure-reports:1.22.0'
        classpath 'com.palantir.javaformat:gradle-palantir-java-format:2.102.0'
        classpath 'com.palantir.baseline:gradle-baseline-java:7.9.0'
        classpath 'com.palantir.gradle.conjure:gradle-conjure:6.6.0'
        classpath 'com.palantir.gradle.gitversion:gradle-git-version:5.1.0'
        classpath 'com.palantir.gradle.idea-configuration:gradle-idea-configuration:0.13.0'
        classpath 'com.palantir.gradle.consistentversions:gradle-consistent-versions:3.21.0'
    }
}

apply plugin: 'com.palantir.external-publish'
apply plugin: 'com.palantir.git-version'
apply plugin: 'com.palantir.baseline'
apply plugin: 'com.palantir.versions-props'
apply plugin: 'com.palantir.external-publish-custom'
apply plugin: 'com.palantir.failure-reports'

allprojects {
    apply plugin: 'com.palantir.java-format'
    version = gitVersion()
    group = 'com.palantir.conjure.verification'

    repositories {
        mavenCentral() { metadataSources { mavenPom(); ignoreGradleMetadataRedirection() } }
    }

    configurations.configureEach {
        // conjure-core's Jersey dependency brings a second copy of javax.inject.
        exclude group: 'org.glassfish.hk2.external', module: 'javax.inject'
    }

    apply plugin: 'java-library'
    sourceCompatibility = JavaVersion.VERSION_11

    // The generated Conjure sources use javax.annotation.Generated, which JDK 11+ no longer ships.
    dependencies {
        compileOnly 'javax.annotation:javax.annotation-api'
    }
}

['server', 'client'].each { String variant ->
    task "${variant}DistTarLinux"(type: Tar) {
        from "target/release/conjure-verification-${variant}"
        archiveBaseName = "verification-${variant}-linux"
        compression = Compression.GZIP
    }

    task "${variant}DistTarOsx"(type: Tar) {
        from "target/osx/release/conjure-verification-${variant}"
        archiveBaseName = "verification-${variant}-osx"
        compression = Compression.GZIP
    }

    // The external-publish plugin publishes to Maven Local during `build`. Rust binaries are
    // built separately, so allow the Gradle build to run without them; release publishing
    // still requires the artifacts to exist.
    ['Linux', 'Osx'].each { String platform ->
        def binary = file(platform == 'Linux'
                ? "target/release/conjure-verification-${variant}"
                : "target/osx/release/conjure-verification-${variant}")
        tasks.withType(org.gradle.api.publish.maven.tasks.PublishToMavenLocal)
                .matching { it.name == "publish${variant.capitalize()}DistTar${platform}PublicationToMavenLocal" }
                .configureEach { onlyIf { binary.isFile() } }
    }

    externalPublishing {
        publication("${variant}DistTarLinux") {
            artifactId = "verification-$variant"
            artifact (tasks["${variant}DistTarLinux"]) {
                classifier = "linux"
            }
        }

        publication("${variant}DistTarOsx") {
            artifactId = "verification-$variant"
            artifact (tasks["${variant}DistTarOsx"]) {
                classifier = "osx"
            }
        }
    }
}
