[package]
name = "serde-conjure-derive"
version = "0.1.4"
authors = ["Steven Fackler <sfackler@palantir.com>"]
edition = "2021"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["visit"] }
proc-macro2 = "1"
quote = "1"

[dev-dependencies]
serde = "1.0"
serde_json = "1.0"

serde-conjure = { path = "../serde-conjure" }
