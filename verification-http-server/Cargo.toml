[package]
name = "conjure-verification-http-server"
edition = "2021"
version = "0.1.0"
authors = ["Dan Sanduleac <dsanduleac@palantir.com>"]
license-file = "../LICENSE"

[dependencies]
conjure-verification-http = { path = "../verification-http" }
conjure-verification-error = { path = "../verification-error" }
conjure-verification-error-derive = { path = "../verification-error-derive" }

bytes = "1"
flate2 = "1.0"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
itertools = "0.14"
lazy_static = "1.0"
log = "0.4"
mime = "0.3"
percent-encoding = "2"
route-recognizer = "0.3.1"
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tokio-stream = "0.1"
url = "2"
